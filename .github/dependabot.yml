# Based on the LF Decentralized Trust Dependabot example:
# https://lf-decentralized-trust.github.io/governance/guidelines/dependabot-example/

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/workflows/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 30
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 30
      semver-major-days: 30
      semver-minor-days: 30
      semver-patch-days: 30
    groups:
      gomod:
        applies-to: version-updates
        patterns: ["*"]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]
