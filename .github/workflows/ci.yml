# SPDX-License-Identifier: Apache-2.0

# Build, vet and test on GitHub-hosted runners.
# Actions are pinned by commit SHA; Dependabot keeps the pins up to date.

name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: "Check formatting"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: "Build"
        run: go build ./...

      - name: "Vet"
        run: go vet ./...

      - name: "Test"
        run: go test ./...
